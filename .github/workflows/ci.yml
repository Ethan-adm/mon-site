name: Intégration Continue (CI)

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_DATABASE: mabase
          MYSQL_USER: monuser
          MYSQL_PASSWORD: monpassword
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Obligatoire pour permettre à Git de comparer l'historique

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances du backend
        working-directory: ./backend
        run: npm install

      - name: Vérifier la syntaxe (fichiers modifiés uniquement)
        working-directory: ./backend
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD | grep '^backend/.*\.js$' | sed 's/backend\///' || true)
          if [ -n "$CHANGED" ]; then npx eslint $CHANGED; else echo "Aucun fichier à linter"; fi

      - name: Lancer les tests unitaires (fichiers modifiés uniquement)
        working-directory: ./backend
        run: npm run test -- --changedSince=origin/main --passWithNoTests